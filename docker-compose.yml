# DistCore Web MVP
#
# Pip uses Orchid Nexus by default (same pip-proxy as other services).
# Before first build on an air‑gapped host: put ODBC .debs in vendor/ (vendor/README.txt).
#
# 1. secrets/db.yml + secrets/dms.yml
# 2. docker compose up --build
#
# UI: http://localhost:8000  |  Live: http://localhost:8000/live  |  DB check: http://localhost:8000/health

services:
  web:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim-bookworm}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://nexus.orchidpharmed.com/repository/pip-proxy/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-nexus.orchidpharmed.com}
        MSODBCSQL_DEB_URL: ${MSODBCSQL_DEB_URL:-}
    image: distcore-web:latest
    ports:
      - "${DISTCORE_PORT:-8000}:8000"
    environment:
      DISTCORE_HOST: "0.0.0.0"
      DISTCORE_PORT: "8000"
      DISTCORE_JOBS_DIR: /app/data/jobs
      DISTCORE_DB_CONFIG: /config/db.yml
      DISTCORE_DMS_CONFIG: /config/dms.yml
      DISTCORE_DMS_AUTH: "${DISTCORE_DMS_AUTH:-ntlm}"
      DISTCORE_DMS_USERNAME: "${DISTCORE_DMS_USERNAME:-}"
      DISTCORE_DMS_PASSWORD: "${DISTCORE_DMS_PASSWORD:-}"
    volumes:
      - ${DISTCORE_DB_CONFIG_HOST:-./secrets/db.yml}:/config/db.yml:ro
      - ${DISTCORE_DMS_CONFIG_HOST:-./secrets/dms.yml}:/config/dms.yml:ro
      - distcore-jobs:/app/data/jobs
    restart: unless-stopped

volumes:
  distcore-jobs:
